<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="Zach Mannon">
  {% if page.noindex %}<meta name="robots" content="noindex">{% else %}<meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">{% endif %}

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zach Mannon">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{{ page.og_title | default: page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:image" content="{{ site.url }}/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zach Mannon, Product &amp; Data Executive">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="stylesheet" href="/css/styles.css">

  {% include structured-data.html %}
</head>
<body>

  {% include nav.html %}

  <main>
{{ content }}
  </main>

  {% include footer.html %}

  <script src="/js/main.js"></script>
</body>
</html>
